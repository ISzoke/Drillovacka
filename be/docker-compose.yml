version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: uvicorn be.asgi:application --host 0.0.0.0 --port 8000 --reload
    environment:
      - DJANGO_SETTINGS_MODULE=be.settings
      - MYSQLHOST=db
      - MYSQLUSER=root
      - MYSQLPASSWORD=secret
      - MYSQLDATABASE=drillovacka-demo
      - MYSQLPORT=3306
      - ALLOWED_HOSTS=superlectures.net,www.superlectures.net,57.128.223.205,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=http://superlectures.net,http://www.superlectures.net,http://57.128.223.205
      - DEBUG=1   # dočasne na ladenie
    volumes:
      - .:/code
    ports:
      - "80:8000"
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: drillovacka-demo
    ports:
      - "3307:3306"  
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d  

volumes:
  db_data:
