version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: uvicorn be.asgi:application --host 0.0.0.0 --port 8000 --reload
    environment:
      - DJANGO_SETTINGS_MODULE=be.settings
      - MYSQLHOST=db
      - MYSQLUSER=root
      - MYSQLPASSWORD=secret
      - MYSQLDATABASE=drillovacka-demo
      - MYSQLPORT=3306
      - ALLOWED_HOSTS=192.168.54.198,superlectures.net,www.superlectures.net,57.128.223.205,localhost,127.0.0.1
      - CSRF_TRUSTED_ORIGINS=http://192.168.54.198,http://superlectures.net,http://www.superlectures.net,http://57.128.223.205
      - DEBUG=1
    volumes:
      - .:/code
    expose:
      - "8000"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../fe/dist:/usr/share/nginx/html:ro
    depends_on:
      - web

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: drillovacka-demo
    ports:
      - "3307:3306"  
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d  

volumes:
  db_data:
