version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: uvicorn be.asgi:application --host 0.0.0.0 --port 8000
    environment:
      - DJANGO_SETTINGS_MODULE=be.settings
      - MYSQLHOST=db
      - MYSQLUSER=root
      - MYSQLPASSWORD=${MYSQLPASSWORD}
      - MYSQLDATABASE=drillovacka-demo
      - MYSQLPORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=192.168.54.198,superlectures.net,www.superlectures.net,57.128.223.205,localhost,127.0.0.1,rightable-georgann-soppingly.ngrok-free.dev,www.rightable-georgann-soppingly.ngrok-free.dev
      - CSRF_TRUSTED_ORIGINS=http://192.168.54.198,http://superlectures.net,http://www.superlectures.net,http://57.128.223.205,https://rightable-georgann-soppingly.ngrok-free.dev/
    volumes:
      - .:/code
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    restart: always
    # Internal Docker network only — no ports exposed, no persistence needed
    # (channel layer state is disposable pub/sub, not durable data).

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../fe/dist:/usr/share/nginx/html:ro
    depends_on:
      - web

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQLPASSWORD}
      MYSQL_DATABASE: drillovacka-demo
    # MySQL port intentionally not exposed — internal Docker network only
    volumes:
      - db_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d  

volumes:
  db_data:
